[package]
name = "videofy"
version = "0.1.0"
description = "Cut scary parts out of movies, losslessly"
authors = ["Jaco"]
edition = "2021"

[lib]
name = "videofy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"

[profile.dev]
# ebur128 parsing + median filtering over ~70k samples is slow unoptimized
opt-level = 2
