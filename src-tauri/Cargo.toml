[package]
name = "videofy"
version = "0.1.0"
description = "Cut scary parts out of movies, losslessly"
authors = ["Jaco"]
edition = "2021"
license = "MIT"

# Declared explicitly: the crate has two binaries, and the Tauri bundler needs
# the app one to be unambiguous. Without this (plus mainBinaryName in
# tauri.conf.json) the bundler shipped scan_report as Videofy.app, which
# double-clicked to nothing.
[[bin]]
name = "videofy"
path = "src/main.rs"

[[bin]]
name = "scan_report"
path = "src/bin/scan_report.rs"

[lib]
name = "videofy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
urlencoding = "2"
ort = "2.0.0-rc.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
whisper-rs = { version = "0.16", features = ["metal"] }

[profile.dev]
# ebur128 parsing + median filtering over ~70k samples is slow unoptimized
opt-level = 2
